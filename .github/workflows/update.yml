name: Update Apple Color Emoji

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest upstream release
        run: |
          echo "Checking latest Apple Emoji release..."

          curl -fsSL \
            https://api.github.com/repos/samuelngs/apple-emoji-ttf/releases/latest \
            -o release.json

          echo "Latest upstream release:"
          grep '"tag_name"' release.json

          echo "Release assets:"
          grep '"name"' release.json
